<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>结课出卷 · 六年级数学</title>

<style>
:root{--ink:#152230;--ink2:#5A6B7C;--line:#D7E1E9;--paper:#fff;--bg:#E9EEF3;--yellow:#F5BE2E;--gold:#C89B24;--green:#0FA97C;--red:#C8503C;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --num:"Space Grotesk","Noto Sans SC",ui-sans-serif,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
.app{max-width:960px;margin:0 auto;padding:clamp(18px,3vw,30px) clamp(16px,4vw,32px) 56px}
.topbar{background:var(--ink);border-radius:14px;padding:clamp(20px,3vw,30px);color:#fff}
.brand{margin:0 0 9px;font-size:12.5px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:14px;height:3px;background:var(--yellow);border-radius:2px}
h1{margin:0;font-size:clamp(24px,3.2vw,34px);font-weight:900;line-height:1.24;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--yellow)}
.sub{margin:11px 0 0;font-size:13px;line-height:1.85;color:rgba(255,255,255,.72);max-width:60ch}
.card{background:var(--paper);border-radius:12px;padding:clamp(16px,2.4vw,22px);margin-top:14px;box-shadow:0 1px 0 rgba(21,34,48,.06)}
.card.on{border:1.5px solid rgba(21,34,48,.14)}
.ph{display:flex;align-items:baseline;gap:9px;margin:0 0 12px;padding-bottom:9px;border-bottom:1.5px solid rgba(21,34,48,.16)}
.ph .n{font-family:var(--num);font-size:11.5px;font-weight:700;color:#fff;background:var(--ink);border-radius:4px;padding:1px 6px}
.ph h2{margin:0;font-size:16.5px;font-weight:900}
.ph .hint{margin:0;font-size:11.8px;color:var(--ink2);margin-left:auto}
.lbl{font-size:12.5px;color:var(--ink2);margin:0 0 6px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer}
.opt.on{background:var(--yellow);border-color:var(--gold);color:#152230}
.input{width:100%;max-width:300px;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:15px;color:var(--ink);background:#fff}
.input:focus{outline:0;border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:9px;background:var(--ink);color:#fff;font-family:inherit;font-size:15px;font-weight:900;padding:12px 22px;cursor:pointer;min-height:46px}
.btn:hover{background:#23374D}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost:hover{background:rgba(245,190,46,.3)}
.btn.y{background:var(--yellow);color:#152230}
.btn.y:hover{background:#E9AE1C}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.reg{margin:0;font-size:12.8px;color:var(--ink2);line-height:1.8}
.reg b{color:var(--ink)}
.paper{margin-top:16px}
.qbox{background:#fff;border-radius:12px;padding:16px 18px 14px;margin-bottom:10px;border:1px solid rgba(21,34,48,.08)}
.qhead{display:flex;align-items:flex-start;gap:9px;margin:0 0 8px}
.qno{font-family:var(--num);font-size:13px;font-weight:700;color:var(--ink2);min-width:22px;padding-top:2px}
.qtx{flex:1;min-width:0}
.qtx .tag{display:inline-block;font-size:10.6px;font-weight:700;color:#4A5C6E;background:#EDF1F5;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.qtx p{margin:0;font-size:14.6px;line-height:1.8;font-weight:500}
.qopts{display:flex;flex-direction:column;gap:7px;margin:10px 0 0 31px}
.qopt{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;padding:4px 6px;border-radius:7px}
.qopt:hover{background:rgba(245,190,46,.14)}
.qopt input{width:17px;height:17px;accent-color:#152230}
.sbox{display:flex;align-items:center;gap:9px;margin:10px 0 0 31px}
.sbox span{font-size:12.8px;color:var(--ink2)}
.sbox input{width:130px;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:14.5px;color:var(--ink)}
.sbox input:focus{outline:0;border-color:var(--gold)}
.ans{margin:12px 0 0 31px;padding-top:11px;border-top:1px dashed rgba(21,34,48,.16);font-size:13px;line-height:1.85;color:var(--ink2)}
.ans b{color:var(--ink)}
.ans .ok{color:var(--green);font-weight:900}
.ans .no{color:var(--red);font-weight:900}
.ans .src{display:block;margin-top:6px;font-size:11px;color:#8595A4}
.score{background:var(--ink);color:#fff;border-radius:12px;padding:20px 22px;margin-top:16px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .big{font-family:var(--num);font-size:34px;font-weight:700;line-height:1}
.score .tot{font-family:var(--num);font-size:15px;color:rgba(255,255,255,.6)}
.score .rate{font-size:14px;font-weight:900;color:var(--yellow);margin-left:auto}
.score p{margin:8px 0 0;flex-basis:100%;font-size:12.8px;color:rgba(255,255,255,.72);line-height:1.8}
.regbox{background:rgba(15,169,124,.1);border:1px solid rgba(15,169,124,.35);border-radius:10px;padding:11px 14px;font-size:12.8px;color:#0B5E47;line-height:1.8;margin-top:12px}
.note{margin:14px 0 0;font-size:11.8px;color:var(--ink2);line-height:1.8}
.footlink{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.foot{font-size:11.6px;color:var(--ink2);margin:16px 0 0;line-height:1.9}
@media (max-width:760px){
  .app{padding:12px 13px 36px}
  .topbar{padding:15px 14px 16px;border-radius:12px}
  h1{font-size:22px;line-height:1.3}
  .sub{font-size:12.2px;line-height:1.78}
  .card{padding:15px 13px;border-radius:11px;margin-top:11px}
  .ph{flex-wrap:wrap;gap:6px}
  .ph h2{font-size:15px;white-space:nowrap;flex:none}
  .ph .n{flex:none}
  .ph .hint{flex-basis:100%;margin-left:0;font-size:11px;margin-top:3px}
  .opt{font-size:12.6px;padding:7px 11px}
  .input{max-width:none;font-size:16px}
  .btn{font-size:14px;min-height:46px}
  .qtx p{font-size:14px;line-height:1.75}
  .qbox{padding:14px 13px 12px}
  .qopts,.sbox,.ans{margin-left:0}
  .score .big{font-size:28px}
}
@media print{
  body{background:#fff}
  .topbar{background:#fff;color:var(--ink);border:1px solid var(--ink);padding:16px}
  .sub{color:var(--ink2)}
  .card,.qbox{box-shadow:none;border:1px solid #ccc;break-inside:avoid-page}
  .no-print{display:none!important}
  .qbox{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">

  <section class="topbar">
    <p class="brand">小布智能教学</p>
    <h1>结课出卷 · <em>六年级数学</em></h1>
    <p class="sub">学完一册，在这里登记，出一张卷子自测。题目按真实考卷的考法编写，交卷当场出分，每题带答案、解析和出处。答错的题会单独列出来，方便回头补那几讲。</p>
  </section>

  <!-- 登记 -->
  <section class="card">
    <div class="ph"><span class="n">01</span><h2>学习登记</h2><p class="hint">记在这台设备上，下次打开还在</p></div>
    <p class="lbl">我已经学完</p>
    <div class="opts" id="booksel">
      <button class="opt" data-book="A">六上 · 数与形（38 讲）</button>
      <button class="opt" data-book="B">六下 · 式与体（20 讲）</button>
      <button class="opt" data-book="AB">两册都学完了</button>
    </div>
    <p class="lbl">称呼（可不填）</p>
    <input class="input" id="who" placeholder="例如：小林妈妈" autocomplete="off">
    <div class="row2"><button class="btn y" id="regbtn">登记并开始出卷</button></div>
    <div class="regbox" id="reginfo" hidden></div>
  </section>

  <!-- 出卷设置 -->
  <section class="card" id="setup" style="display:none">
    <div class="ph"><span class="n">02</span><h2>出卷设置</h2><p class="hint">按登记范围抽题，不会重复同一道</p></div>
    <p class="reg" id="cap"></p>
    <p class="lbl">题量</p>
    <div class="opts" id="nsel">
      <button class="opt" data-n="10">10 题 · 小测</button>
      <button class="opt on" data-n="20">20 题 · 标准</button>
      <button class="opt" data-n="30">30 题 · 加量</button>
    </div>
    <p class="lbl">难度</p>
    <div class="opts" id="dsel">
      <button class="opt" data-d="1">基础为主</button>
      <button class="opt on" data-d="2">基础＋提高</button>
      <button class="opt" data-d="3">偏挑战</button>
    </div>
    <div class="row2"><button class="btn" id="makebtn">生成试卷</button><button class="btn ghost" id="printbtn" style="display:none">打印这张卷</button></div>
  </section>

  <section class="paper" id="paper"></section>
  <div class="score" id="score" style="display:none"></div>
  <div class="row2 no-print" id="after" style="display:none">
    <button class="btn ghost" id="redobtn">只重做错题</button>
    <button class="btn ghost" id="againbtn">重新出一张</button>
  </div>

  <div class="footlink no-print">
    <a class="btn ghost" href="六年级数学合集-沪教版.html">回到第一册</a>
    <a class="btn ghost" href="六年级数学合集-第二学期.html">回到第二册</a>
  </div>
  <p class="foot">题目按上海六上、六下期末与名校卷的常见考法编写，出处标在每题下方；同型题，不是原卷原题。判分只认答案，过程分不计，所以做错的题请对照解析再看一遍。</p>
</div>

var REGKEY="g6math.reg";
var state={book:"",n:20,d:2,paper:[],answers:{},done:false};

function $(id){return document.getElementById(id)}
function norm(s){
  s=String(s==null?"":s).trim().toLowerCase();
  s=s.replace(/[\uFF01-\uFF5E]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)});
  s=s.replace(/\s/g,"").replace(/，|,/g,"").replace(/：/g,":").replace(/／/g,"/").replace(/。/g,"").replace(/°/g,"");
  return s;
}
function same(a,b){
  a=norm(a);b=norm(b);
  if(a===b)return true;
  var x=parseFloat(a),y=parseFloat(b);
  if(!isNaN(x)&&!isNaN(y)&&Math.abs(x-y)<0.011)return true;
  return false;
}
function saveReg(b,who){
  try{localStorage.setItem(REGKEY,JSON.stringify({book:b,who:who,time:new Date().toISOString().slice(0,16).replace("T"," ")}))}catch(e){}
}
function loadReg(){try{return JSON.parse(localStorage.getItem(REGKEY)||"null")}catch(e){return null}}

var reg=loadReg();
if(reg){
  state.book=reg.book||"";
  if(reg.who)$("who").value=reg.who;
  document.querySelectorAll("#booksel .opt").forEach(function(b){b.classList.toggle("on",b.dataset.book===state.book)});
  showReg(reg);
  if(state.book){$("setup").style.display="block";capText();}
}
function showReg(r){
  var names={A:"六上 · 数与形",B:"六下 · 式与体",AB:"两册都学完"};
  var box=$("reginfo");
  box.hidden=false;
  box.innerHTML="已登记：<b>"+(names[r.book]||"未选择")+"</b>"+(r.who?"，称呼 <b>"+r.who+"</b>":"")+"　登记时间 "+r.time+"。可以直接出卷，也可以在下面改。";
}

document.querySelectorAll("#booksel .opt").forEach(function(b){
  b.onclick=function(){
    state.book=b.dataset.book;
    document.querySelectorAll("#booksel .opt").forEach(function(x){x.classList.toggle("on",x===b)});
    capText();
  };
});
$("regbtn").onclick=function(){
  if(!state.book){alert("先选一下学完哪一册");return}
  var who=$("who").value.trim();
  saveReg(state.book,who);
  showReg(loadReg());
  $("setup").style.display="block";
  capText();
  $("setup").scrollIntoView({behavior:"smooth",block:"start"});
};
document.querySelectorAll("#nsel .opt").forEach(function(b){
  b.onclick=function(){state.n=+b.dataset.n;document.querySelectorAll("#nsel .opt").forEach(function(x){x.classList.toggle("on",x===b)})};
});
document.querySelectorAll("#dsel .opt").forEach(function(b){
  b.onclick=function(){state.d=+b.dataset.d;document.querySelectorAll("#dsel .opt").forEach(function(x){x.classList.toggle("on",x===b)})};
});

function pool(){
  var books=state.book==="AB"?["A","B"]:[state.book];
  return BANK.filter(function(q){return books.indexOf(q.b)>-1});
}
function take(arr,n){var a=arr.slice();var out=[];while(out.length<n&&a.length){out.push(a.splice(Math.floor(Math.random()*a.length),1)[0])}return out}
function build(n){
  var p=pool();
  var want1=Math.round(n*(state.d===1?0.7:state.d===2?0.4:0.2));
  var want3=Math.round(n*(state.d===1?0:state.d===2?0.2:0.5));
  var easy=take(p.filter(function(q){return q.d===1}),want1);
  var hard=take(p.filter(function(q){return q.d===3}),want3);
  var mid=take(p.filter(function(q){return q.d===2}),n-easy.length-hard.length);
  var out=easy.concat(mid).concat(hard);
  var more=n-out.length;
  if(more>0){
    var used=new Set(out);
    out=out.concat(take(p.filter(function(q){return !used.has(q)}),more));
  }
  out.sort(function(){return Math.random()-0.5});
  return out.slice(0,n);
}
function capText(){
  var c=pool().length;
  var el=$("cap");
  if(el)el.textContent="当前范围题库共 "+c+" 题；要的题量超过时会按可用题数出卷。";
  document.querySelectorAll("#nsel .opt").forEach(function(b){
    b.disabled=(+b.dataset.n>c);
    b.style.opacity=(+b.dataset.n>c)?.45:"";
    b.style.cursor=(+b.dataset.n>c)?"default":"";
  });
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function render(){
  var paper=state.paper;
  var html="";
  paper.forEach(function(q,i){
    html+='<article class="qbox" data-i="'+i+'">';
    html+='<div class="qhead"><span class="qno">'+(i+1)+'.</span><div class="qtx"><p><span class="tag">'+esc(q.k)+'</span>'+esc(q.q)+'</p></div></div>';
    if(q.t==="c"){
      html+='<div class="qopts">';
      "ABCD".split("").forEach(function(L,j){
        html+='<label class="qopt"><input type="radio" name="q'+i+'" value="'+j+'"><span>'+L+"．"+esc(q.o[j])+'</span></label>';
      });
      html+='</div>';
    }else{
      html+='<div class="sbox"><input class="ansinput" name="q'+i+'" placeholder="在这里写答案" autocomplete="off"><span>只填结果，不用写过程</span></div>';
    }
    html+='<div class="ans" hidden></div>';
    html+='</article>';
  });
  $("paper").innerHTML=html;
  $("paper").querySelectorAll("input").forEach(function(el){
    el.onchange=function(){state.answers[el.name]=el.value};
    el.oninput=function(){state.answers[el.name]=el.value};
  });
  $("printbtn").style.display="inline-flex";
}
function answerOf(q,i){return state.answers["q"+i]}

$("makebtn").onclick=function(){
  if(!state.book){alert("先在 01 里选学完哪一册并登记");return}
  var cap=pool().length;
  state.paper=build(Math.min(state.n,cap));
  state.answers={};
  state.done=false;
  $("score").style.display="none";
  $("after").style.display="none";
  render();
  $("paper").scrollIntoView({behavior:"smooth",block:"start"});
  var row=document.createElement("div");
  row.className="row2 no-print";
  row.innerHTML='<button class="btn y" id="submitbtn">交卷看分</button>';
  $("paper").appendChild(row);
  $("submitbtn").onclick=submit;
};
function submit(){
  var ok=0,rows="",wrong=[];
  state.paper.forEach(function(q,i){
    var box=$("paper").querySelector('.qbox[data-i="'+i+'"] .ans');
    var v=answerOf(q,i);
    var right;
    if(q.t==="c")right=(v!==undefined&&String(v)===String(q.a));
    else right=same(v,q.a);
    if(right)ok++;else wrong.push(i+1);
    var mine;
    if(q.t==="c")mine=v!==undefined?"ABCD".split("")[+v]: "（未答）";
    else mine=(v&&String(v).trim())||"（未答）";
    var rightTxt=q.t==="c"?"ABCD".split("")[+q.a]+"．"+q.o[+q.a]:q.a;
    box.hidden=false;
    box.innerHTML=(right?'<span class="ok">✓ 答对</span>':'<span class="no">✗ 答错</span>')+
      '　你的答案：<b>'+esc(mine)+'</b>　正确答案：<b>'+esc(rightTxt)+'</b><br>'+esc(q.x)+
      '<span class="src">'+esc(q.s)+'</span>';
  });
  var total=state.paper.length,rate=ok/total;
  var word=rate>=0.9?"扎实，这一册可以往下走了":rate>=0.75?"基本扎实，个别知识点还要回头看":"还有明显缺口，建议先按错题找到对应讲次补一遍";
  var sc=$("score");
  sc.style.display="flex";
  sc.innerHTML='<span class="big">'+ok+'</span><span class="tot">/ '+total+' 题</span><span class="rate">'+(rate*100).toFixed(0)+'%</span><p>'+word+(wrong.length?"。错在第 "+wrong.join("、")+" 题，点下面「只重做错题」再练一遍。":"。全对。")+'</p>';
  $("after").style.display="flex";
  $("submitbtn").disabled=true;
  $("score").scrollIntoView({behavior:"smooth",block:"center"});
}
$("redobtn").onclick=function(){
  var wrongI=[];
  state.paper.forEach(function(q,i){
    var v=answerOf(q,i);var right=q.t==="c"?(v!==undefined&&String(v)===String(q.a)):same(v,q.a);
    if(!right)wrongI.push(q);
  });
  if(!wrongI.length){alert("没有错题");return}
  state.paper=wrongI;state.answers={};state.done=false;
  $("score").style.display="none";$("after").style.display="none";
  render();
  var row=document.createElement("div");row.className="row2 no-print";
  row.innerHTML='<button class="btn y" id="submitbtn">交卷看分</button>';
  $("paper").appendChild(row);$("submitbtn").onclick=submit;
  $("paper").scrollIntoView({behavior:"smooth",block:"start"});
};
$("againbtn").onclick=function(){ $("makebtn").click() };
$("printbtn").onclick=function(){window.print()};
</script>
